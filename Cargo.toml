[workspace]
resolver = "2"
members = ["crates/kovanica-dag", "crates/kovanica-state"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/BetterCallDzuks/kovanica-ledger"
rust-version = "1.75"

[workspace.dependencies]
blake3 = "1"
hex = "0.4"
# Ed25519 spend authorisation. Pinned to 2.x to stay within the workspace MSRV.
ed25519-dalek = "2"
